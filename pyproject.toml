[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deslab-portable"
dynamic = ["version"]
description = "Discrete event systems modeled as automata"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "BSD"}
authors = [
  {name = "Leonardo Clavijo, Daniel Ramos Garcia, Joao Carlos Basilio, Lilian Kawakami", email = "deslab@ufrj.br"},
]
keywords = ["automata", "discrete event systems", "diagnosis", "supervisory control"]
dependencies = [
  "networkx>=2.8.8",
  "pandas>=2.0.3",
  "portion>=2.5.0",
  "pydot>=3.0.1",
  "pyparsing>=3.1.4",
  "wasi-graphviz[wasmtime]>=0.1.4; python_version >= '3.11'",
  "wasmtime>=50.0.1,<51; python_version >= '3.11'",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["deslab_portable", "deslab_portable.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "deslab_portable.version.__version__"}

[tool.setuptools.package-data]
"deslab_portable.graphics" = ["_tex_assets/*"]
